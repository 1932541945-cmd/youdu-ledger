<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻步手记</title><style>*{box-sizing:border-box}body{margin:auto;padding:20px 16px 50px;max-width:720px;background:#eff3ed;color:#234438;font:16px/1.65 system-ui}header,section{border-radius:18px;padding:20px;margin:14px 0;background:#fffef9}header{background:#255440;color:#fffbed}h1,h2{font-family:serif;margin:0}header p{margin:6px 0}nav{display:flex;gap:6px}button,input,textarea{font:inherit;padding:9px;border:1px solid #afc0b2;border-radius:8px;background:white;color:inherit}.on,form button{background:#285946;color:white}label{display:block;margin:12px 0}input,textarea{width:100%}small{color:#546c61}article{padding:12px 0;border-top:1px solid #dce4da}svg{width:100%;height:85px;background:#eef5ed}output{display:block}</style><main><header><h1>轻步手记</h1><p>记下三餐、活动和身体变化。</p></header><nav></nav><div id="daily"><label>记录日期<input id="day" type="date"></label><form><section><h2>今天吃了什么</h2><div id="meals"></div></section><section><h2>活动与测量</h2><div id="moves"></div></section><button>保存当天记录</button><output id="notice"></output></form></div><section id="plan" hidden><h2>我的一周计划</h2><label>饮食与运动安排<textarea rows="8" id="goal"></textarea></label><button id="saveGoal">保存安排</button><output id="saved"></output></section><section id="past" hidden><h2>历史趋势</h2><div id="charts"></div><div id="rows"></div></section><small>记录存在当前浏览器。清除网站数据会删除记录。</small></main><script>
const el=id=>document.getElementById(id),mk=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n},key='qingbu-days-v1',read=()=>JSON.parse(localStorage.getItem(key)||'{}');
const fields=['早餐','午餐','晚餐','零食与加餐','运动项目','运动时长（分钟）','体重（kg）','腰围（cm）'];fields.forEach((s,i)=>{const l=mk('label',s),x=mk('input','');x.id='f'+i;if(i>4){x.type='number';x.min=i===5?'0':'0.1';x.step=i===5?'1':'0.1'}l.append(x);el(i<4?'meals':'moves').append(l)});
const views=['daily','plan','past'];function show(k){views.forEach(v=>{el(v).hidden=k!==v;el(v+'Tab').className=k===v?'on':''});if(k==='past')review()}views.forEach((v,i)=>{const b=mk('button',['每日记录','一周计划','历史趋势'][i]);b.id=v+'Tab';b.onclick=()=>show(v);document.querySelector('nav').append(b)});
function load(){const row=read()[el('day').value]||[];fields.forEach((_,i)=>el('f'+i).value=row[i]||'');el('notice').value=''}function review(){const all=read(),ds=Object.keys(all).sort();el('rows').replaceChildren();el('charts').replaceChildren();for(const i of [6,7]){const dates=ds.filter(d=>+all[d][i]>0),vals=dates.map(d=>+all[d][i]);el('charts').append(mk('p',fields[i]+(dates.length?' · 最近 '+vals[vals.length-1]:' · 尚无记录')));if(vals.length<2)continue;const lo=Math.min(...vals),hi=Math.max(...vals),a=Date.parse(dates[0]),z=Date.parse(dates[dates.length-1]),pts=vals.map((v,j)=>[8+284*(Date.parse(dates[j])-a)/(z-a),hi===lo?40:70-60*(v-lo)/(hi-lo)].join(',')).join(' ');el('charts').insertAdjacentHTML('beforeend','<svg viewBox="0 0 300 80"><polyline fill="none" stroke="#377a54" stroke-width="3" points="'+pts+'"/></svg>');el('charts').append(mk('small',dates[0]+' 至 '+dates[dates.length-1]+' · 范围 '+lo+'–'+hi))}if(!ds.length)el('rows').textContent='保存后即可按日期回看。';ds.reverse().forEach(d=>{const a=mk('article',''),b=mk('button',d+' · 修改');b.onclick=()=>{el('day').value=d;load();show('daily');window.scrollTo(0,0)};a.append(b,mk('p',all[d].map((v,i)=>v?fields[i]+' '+v:'').filter(Boolean).join(' ｜ ')));el('rows').append(a)})}
const now=new Date();el('day').value=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,10);el('day').onchange=load;document.querySelector('form').onsubmit=e=>{e.preventDefault();const d=el('day').value,row=fields.map((_,i)=>el('f'+i).value.trim());if(!d||!row.some(Boolean)){el('notice').value='请选择日期并至少填写一项';return}try{const all=read();all[d]=row;localStorage.setItem(key,JSON.stringify(all));el('notice').value='已保存 '+d}catch{el('notice').value='保存失败，请检查浏览器存储设置'}};
el('goal').value=localStorage.getItem('qingbu-plan')??'周一、周四：晚饭后散步。\n周二、周六：选熟悉的居家动作，记录运动时长。\n周三、周五：久坐间隙起身走动。\n周日：回看饮食和运动记录，调整下周安排。';el('saveGoal').onclick=()=>{try{localStorage.setItem('qingbu-plan',el('goal').value);el('saved').value='已保存'}catch{el('saved').value='保存失败'}};load();show('daily');</script></html>
