<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻步手记</title><style>*{box-sizing:border-box}body{margin:auto;padding:20px 16px 50px;max-width:720px;background:#eff3ed;color:#234438;font:16px/1.65 system-ui}header,section{border-radius:18px;padding:20px;margin:14px 0;background:#fffef9}header{background:#255440;color:#fffbed}h1,h2{font-family:serif;margin:0}header p{margin:6px 0}nav{display:flex;gap:6px;flex-wrap:wrap}summary{cursor:pointer;font-weight:650}details{border-top:1px solid #dce4da;padding:12px 0}.focus{background:#e1edde;border-left:4px solid #508465;padding:12px 15px;margin:12px 0}.focus p{margin:4px 0}button,input,textarea{font:inherit;padding:9px;border:1px solid #afc0b2;border-radius:8px;background:white;color:inherit}.on,form button{background:#285946;color:white}label{display:block;margin:12px 0}input,textarea{width:100%}small{color:#546c61}article{padding:12px 0;border-top:1px solid #dce4da}svg{width:100%;height:85px;background:#eef5ed}output{display:block}</style><main><header><h1>轻步手记</h1><p>记下三餐、活动和身体变化。</p></header><nav></nav><div id="daily"><label>记录日期<input id="day" type="date"></label><section><h2>今天的一小步</h2><div class="focus" id="focus"></div><details><summary>赶时间时，午饭怎么选？</summary><p>有剩饭：热好米饭，配番茄炒蛋和一份青菜。只有面条：煮面时加青菜，搭配鸡蛋或豆腐。要出门：先选一份方便吃的主食，再搭配蔬菜和蛋、肉或豆制品。</p></details><details><summary>想吃零食时，怎么记？</summary><p>可以写食物、份量和当时的情境，例如「薯片一小碗，打游戏时吃」。周末回看，找出自己吃得舒服的一次，把那次的做法留到下周。</p></details></section><form><section><h2>今天吃了什么</h2><div id="meals"></div></section><section><h2>今天怎么动</h2><div id="moves"></div></section><button>保存当天记录</button><output id="notice"></output></form></div><section id="plan" hidden><h2>我的一周计划</h2><label>饮食与运动安排<textarea rows="8" id="goal"></textarea></label><button id="saveGoal">保存安排</button><output id="saved"></output></section><section id="measure" hidden><h2>阶段测量</h2><p>腰围可以隔几周再量一次，也可以按自己的节奏记录。选择实际测量日期，有哪一项就填哪一项。</p><form id="metrics"><label>测量日期<input id="md" type="date" required></label><div id="numbers"></div><button>保存测量</button><output id="ms"></output></form></section><section id="past" hidden><h2>历史趋势</h2><p id="weekly"></p><div id="charts"></div><div id="rows"></div></section><small>记录存在当前浏览器。清除网站数据会删除记录。</small></main><script>
const el=id=>document.getElementById(id),mk=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n},key='qingbu-days-v1',read=()=>JSON.parse(localStorage.getItem(key)||'{}');
const fields=['早餐','午餐','晚餐','零食与加餐','运动项目','运动时长（分钟）','体重（kg）','腰围（cm）'];fields.forEach((s,i)=>{const l=mk('label',s),x=mk('input','');x.id='f'+i;if(i>4){x.type='number';x.min=i===5?'0':'0.1';x.step=i===5?'1':'0.1'}l.append(x);el(i<4?'meals':i<6?'moves':'numbers').append(l)});
const views=['daily','plan','measure','past'];function show(k){views.forEach(v=>{el(v).hidden=k!==v;el(v+'Tab').className=k===v?'on':''});if(k==='past')review()}views.forEach((v,i)=>{const b=mk('button',['每日记录','一周计划','阶段测量','历史趋势'][i]);b.id=v+'Tab';b.onclick=()=>show(v);document.querySelector('nav').append(b)});
function load(){const row=read()[el('day').value]||[];fields.slice(0,6).forEach((_,i)=>el('f'+i).value=row[i]||'');dailyFocus();el('notice').value=''}function review(){const all=read(),ds=Object.keys(all).sort();const recent=ds.filter(d=>Date.parse(d)<=Date.parse(today)&&Date.parse(d)>Date.parse(today)-7*86400000);el("weekly").textContent="近七天 · 午餐有记录 "+recent.filter(d=>all[d][1]).length+" 天，累计记录运动 "+recent.reduce((n,d)=>n+(Number(all[d][5])||0),0)+" 分钟";el('rows').replaceChildren();el('charts').replaceChildren();for(const i of [6,7]){const dates=ds.filter(d=>+all[d][i]>0),vals=dates.map(d=>+all[d][i]);el('charts').append(mk('p',fields[i]+(dates.length?' · 最近 '+vals[vals.length-1]:' · 尚无记录')));if(vals.length<2)continue;const lo=Math.min(...vals),hi=Math.max(...vals),a=Date.parse(dates[0]),z=Date.parse(dates[dates.length-1]),pts=vals.map((v,j)=>[8+284*(Date.parse(dates[j])-a)/(z-a),hi===lo?40:70-60*(v-lo)/(hi-lo)].join(',')).join(' ');el('charts').insertAdjacentHTML('beforeend','<svg viewBox="0 0 300 80"><polyline fill="none" stroke="#377a54" stroke-width="3" points="'+pts+'"/></svg>');el('charts').append(mk('small',dates[0]+' 至 '+dates[dates.length-1]+' · 范围 '+lo+'–'+hi))}if(!ds.length)el('rows').textContent='保存后即可按日期回看。';ds.reverse().forEach(d=>{const a=mk('article',''),b=mk('button',d+' · 修改');b.onclick=()=>{el('day').value=d;el('md').value=d;load();loadMeasures();show(all[d].slice(0,6).some(Boolean)?'daily':'measure');window.scrollTo(0,0)};a.append(b,mk('p',all[d].map((v,i)=>v?fields[i]+' '+v:'').filter(Boolean).join(' ｜ ')));el('rows').append(a)})}
const now=new Date();el('day').value=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,10);el('day').onchange=load;document.querySelector('form').onsubmit=e=>{e.preventDefault();const d=el('day').value,row=fields.slice(0,6).map((_,i)=>el('f'+i).value.trim());if(!d||!row.some(Boolean)){el('notice').value='请选择日期并至少填写一项';return}try{const all=read();all[d]=row.concat((all[d]||[]).slice(6));localStorage.setItem(key,JSON.stringify(all));el('notice').value='已保存 '+d}catch{el('notice').value='保存失败，请检查浏览器存储设置'}};
el('goal').value=localStorage.getItem('qingbu-plan')??'周一、周四：晚饭后散步。\n周二、周六：选熟悉的居家动作，记录运动时长。\n周三、周五：久坐间隙起身走动。\n周日：回看饮食和运动记录，调整下周安排。';el('saveGoal').onclick=()=>{try{localStorage.setItem('qingbu-plan',el('goal').value);el('saved').value='已保存'}catch{el('saved').value='保存失败'}};const today=el('day').value;el('md').value=today;
const ideas=[['周日 · 回看这一周','打开历史趋势，挑一道愿意再做的午餐，再选一个下周能留给运动的时间。'],['周一 · 先安排午餐','早餐后决定中午吃什么；晚饭后如果有空，选一段熟悉的路线散步。'],['周二 · 重新熟悉器械','选一个以前练过的轻哑铃动作，先做一小组。把动作名、实际重量和时长记下来。'],['周三 · 给游戏加个间歇','一局结束时先起身走一圈，再决定是否开始下一局。'],['周四 · 给明天留份午餐','做晚饭时多备一份蔬菜或主食。饭后有空就在附近走十分钟。'],['周五 · 看看加餐的情境','吃加餐时随手记一句：当时饿了、想尝味道，还是刚好手边有？'],['周六 · 重复一次喜欢的活动','散步、垫上活动、熟悉的哑铃动作任选一个。记录实际做了什么，给下周作参考。']];function dailyFocus(){const item=ideas[new Date(el('day').value+'T12:00:00').getDay()];el('focus').replaceChildren();if(item)el('focus').append(mk('strong',item[0]),mk('p',item[1]))}
function loadMeasures(){const r=read()[el('md').value]||[];for(const i of [6,7])el('f'+i).value=r[i]||'';el('ms').value=''}el('md').onchange=loadMeasures;el('metrics').onsubmit=e=>{e.preventDefault();const d=el('md').value,values=[6,7].map(i=>el('f'+i).value);if(!values.some(Boolean)){el('ms').value='请填写一项测量值';return}try{const all=read(),row=all[d]||Array(8).fill('');row[6]=values[0];row[7]=values[1];all[d]=row;localStorage.setItem(key,JSON.stringify(all));el('ms').value='测量已保存'}catch{el('ms').value='保存失败'}};loadMeasures();load();show('daily');</script></html>
