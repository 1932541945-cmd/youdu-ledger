<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心情手记</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f0;color:#284235;font:17px/1.65 system-ui,sans-serif}main{max-width:640px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;border-bottom:1px solid #c7d4ca;padding-bottom:16px}section{margin:18px 0;padding:24px;background:white;border-radius:20px}.intro{background:#deebdf}h1,h2{font-family:serif;margin:0 0 10px}button,select,textarea{font:inherit;padding:10px 13px;border:1px solid #93aa98;border-radius:10px;background:white;color:inherit}button{margin:7px 4px 0 0;cursor:pointer}.green{background:#315b43;color:white}label{display:block;margin:12px 0 4px}select,textarea{width:100%}article{padding:12px 0;border-top:1px solid #ddd;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#556b5e}</style><main><header><b>◒ 心情手记</b><small id="day"></small></header><section class="intro"><h1>此刻，你感觉怎么样？</h1><p>可以只选一个词，也可以多写几句。</p><button class="green" id="write">记录心情</button><button id="pause">我现在很冲动</button></section><section id="help" hidden><h2>给自己一点时间</h2><label for="urge">此刻最想做什么？</label><select id="urge"><option>想一下子吃很多</option><option>想马上买东西</option><option>想放弃，什么都不做</option></select><p id="tip"></p><button id="next">记下现在的感觉</button></section><section><h2>写下这一刻</h2><form><label for="mood">我的心情</label><select required id="mood"><option value="">选一个最接近的词</option><option>低落</option><option>焦虑</option><option>着急</option><option>委屈</option><option>疲惫</option><option>平静</option><option>开心</option><option>说不清</option></select><label for="imp">伴随的冲动（选填）</label><select id="imp"><option value="">暂时跳过</option><option>想一下子吃很多</option><option>想马上买东西</option><option>想放弃，什么都不做</option></select><label for="note">想留给自己的话（选填）</label><textarea id="note" rows="3" placeholder="刚刚发生了什么？现在最需要什么？"></textarea><button class="green">保存这条心情</button></form><span role="status" id="msg"></span></section><section><h2>过往手记</h2><div id="past"></div><small>记录只保存在当前浏览器。清除网站数据或关闭无痕窗口可能丢失记录。</small></section></main><script>const by=id=>document.getElementById(id),key='xinqing-shouji.entries.v1';by('day').textContent=new Date().toLocaleDateString('zh-CN');const tips=['问问自己：我饿了吗，还是想找点安慰？饿了可以安心吃饭。也可以找信任的人聊两句。','先把商品收藏，退出付款页面。等心情缓下来，再决定是否需要它。','现在只选一件做得到的小事：坐舒服一点，打开窗，或给朋友发个表情。'];function tip(){by('tip').textContent=tips[by('urge').selectedIndex]}by('pause').onclick=()=>{by('help').hidden=false;tip();by('urge').focus()};by('urge').onchange=tip;by('write').onclick=()=>by('mood').focus();by('next').onclick=()=>{by('imp').value=by('urge').value;by('mood').focus()};function read(){return JSON.parse(localStorage.getItem(key)||'[]')}function show(){let p=by('past');p.replaceChildren();try{let rows=read();if(!rows.length)p.textContent='你的第一条手记会出现在这里。';for(let r of rows){let a=document.createElement('article');a.textContent=[new Date(r.date).toLocaleString('zh-CN'),[r.mood,r.impulse].filter(Boolean).join(' · '),r.note].filter(Boolean).join(String.fromCharCode(10));p.append(a)}}catch{p.textContent='暂时无法读取手记。'}}document.querySelector('form').onsubmit=e=>{e.preventDefault();try{let rows=read();rows.unshift({date:new Date().toISOString(),mood:by('mood').value,impulse:by('imp').value,note:by('note').value.trim()});localStorage.setItem(key,JSON.stringify(rows));e.target.reset();by('msg').textContent='已保存到过往手记。';show()}catch{by('msg').textContent='保存失败，请先复制输入的文字。'}};window.addEventListener('storage',show);show();</script></html>
