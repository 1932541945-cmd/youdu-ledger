<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心情手记</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f0;color:#284235;font:17px/1.65 system-ui,sans-serif}main{max-width:640px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;border-bottom:1px solid #c7d4ca;padding-bottom:16px}section{margin:18px 0;padding:24px;background:white;border-radius:20px}.intro{background:#deebdf}h1,h2{font-family:serif;margin:0 0 10px}button,select,textarea{font:inherit;padding:10px 13px;border:1px solid #93aa98;border-radius:10px;background:white;color:inherit}button{margin:7px 4px 0 0;cursor:pointer}.green{background:#315b43;color:white}label{display:block;margin:12px 0 4px}select,textarea{width:100%}article{padding:12px 0;border-top:1px solid #ddd;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#556b5e}</style><main><header><b>◒ 心情手记</b><small id="day"></small></header><section class="intro"><h1>此刻，你感觉怎么样？</h1><p>可以只选一个词，也可以多写几句。</p><button class="green" id="write">记录心情</button><button id="pause">我现在很冲动</button></section><section id="help" hidden><h2>给自己一点时间</h2><label for="urge">此刻最想做什么？</label><select id="urge"><option>想一下子吃很多</option><option>想马上买东西</option><option>想放弃，什么都不做</option></select><p>先把双脚放稳，看看周围，找一件能看清颜色的东西。可以轻声说「我注意到，我现在有点……」。</p><label for="before">此刻冲动有多强？（0 无，10 最强）</label><select id="before"><option value="">可跳过</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><p id="tip"></p><label for="action">我实际尝试了什么？</label><select id="action"><option value="">可跳过</option><option>感受脚底和周围环境</option><option>收藏商品并退出支付</option><option>照顾饥饿或进餐</option><option>联系一个人</option><option>做一件小事</option><option>其他</option></select><label for="after">做完后，冲动有多强？</label><select id="after"><option value="">可跳过</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><label for="outcome">后来发生了什么？</label><select id="outcome"><option value="">可跳过</option><option>暂缓了决定</option><option>按自己的需要行动了</option><option>还是按冲动做了</option><option>还没决定</option></select><button id="next">带入手记</button></section><section><h2>写下这一刻</h2><form><label for="mood">我的心情</label><select required id="mood"><option value="">选一个最接近的词</option><option>低落</option><option>焦虑</option><option>着急</option><option>委屈</option><option>疲惫</option><option>平静</option><option>开心</option><option>说不清</option></select><label for="imp">伴随的冲动（选填）</label><select id="imp"><option value="">暂时跳过</option><option>想一下子吃很多</option><option>想马上买东西</option><option>想放弃，什么都不做</option></select><label for="trigger">刚才发生了什么？</label><select id="trigger"><option value="">可跳过</option><option>工作或学习压力</option><option>人际摩擦</option><option>等待消息</option><option>疲惫或睡眠不足</option><option>独处</option><option>看到商品或促销</option><option>其他</option></select><label for="note">想留给自己的话（选填）</label><textarea id="note" rows="3" placeholder="刚刚发生了什么？现在最需要什么？"></textarea><button class="green">保存这条心情</button></form><span role="status" id="msg"></span></section><section><h2>我的规律</h2><label for="period">回看范围</label><select id="period"><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="0">全部记录</option></select><p id="summary" style="white-space:pre-line"></p><small>只汇总实际填写的项目。漏记的日子不会算作零分。</small></section><section><h2>过往手记</h2><div id="past"></div><small>记录只保存在当前浏览器。清除网站数据或关闭无痕窗口可能丢失记录。</small></section><section><details><summary>练习依据</summary><p>觉察、命名情绪和感受脚底的练习参考 <a href="https://tdr.who.int/home/our-work/global-engagement/9789240003927">世界卫生组织压力管理指南</a>。关于进食，<a href="https://www.nice.org.uk/guidance/ng69/chapter/recommendations">NICE 指南</a>强调规律进餐和识别诱因。若反复感到进食失控并为此痛苦，可以和专业人员谈谈。</p><p>0–10 分只用来比较你自己的体验。记录中同时出现的事情不能证明因果。</p></details></section></main><script>const by=id=>document.getElementById(id),key='xinqing-shouji.entries.v1';by('day').textContent=new Date().toLocaleDateString('zh-CN');const tips=['问问自己：我饿了吗，还是想找点安慰？饿了可以安心吃饭。也可以找信任的人聊两句。','先把商品收藏，退出付款页面。等心情缓下来，再决定是否需要它。','现在只选一件做得到的小事：坐舒服一点，打开窗，或给朋友发个表情。'];function tip(){by('tip').textContent=tips[by('urge').selectedIndex]}by('pause').onclick=()=>{by('help').hidden=false;tip();by('urge').focus()};by('urge').onchange=tip;by('write').onclick=()=>by('mood').focus();by('next').onclick=()=>{by('imp').value=by('urge').value;by('help').dataset.linked='yes';by('mood').focus()};function read(){return JSON.parse(localStorage.getItem(key)||'[]')}function patterns(rows){
 const days=Number(by('period').value),start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-days+1);
 const group=rows.filter(r=>!days||new Date(r.date)>=start);
 if(!group.length){by('summary').textContent='这段时间还没有手记。写下第一条后，这里会开始汇总。';return}
 function counts(k){const m=new Map();for(const r of group){if(r[k])m.set(r[k],(m.get(r[k])||0)+1)}return [...m].sort((a,b)=>b[1]-a[1]).map(([v,n])=>v+' '+n+' 次').join('、')||'暂未填写'}
 const paired=group.filter(r=>Number.isInteger(r.before)&&Number.isInteger(r.after));
 const lines=['共 '+group.length+' 条手记','心情：'+counts('mood'),'触发情境：'+counts('trigger'),'冲动：'+counts('impulse'),'行动结果：'+counts('outcome')];
 if(paired.length)lines.push('有前后评分的 '+paired.length+' 次记录中，'+paired.filter(r=>r.after<r.before).length+' 次冲动减弱。');
 by('summary').textContent=lines.join('\n');
}
by('period').onchange=()=>show();
function show(){let p=by('past');p.replaceChildren();try{let rows=read();patterns(rows);if(!rows.length)p.textContent='你的第一条手记会出现在这里。';for(let r of rows){let a=document.createElement('article');a.textContent=[new Date(r.date).toLocaleString('zh-CN'),[r.mood,r.impulse].filter(Boolean).join(' · '),r.trigger,r.action,Number.isInteger(r.before)?"开始时冲动 "+r.before+"/10":"",Number.isInteger(r.after)?"行动后冲动 "+r.after+"/10":"",r.outcome,r.note].filter(Boolean).join(String.fromCharCode(10));p.append(a)}}catch{p.textContent='暂时无法读取手记。'}}function practice(){if(by('help').dataset.linked!=='yes'||by('imp').value!==by('urge').value)return {};const score=id=>by(id).value===''?null:Number(by(id).value);return {before:score('before'),after:score('after'),action:by('action').value,outcome:by('outcome').value}}
document.querySelector('form').onsubmit=e=>{e.preventDefault();try{let rows=read();rows.unshift({date:new Date().toISOString(),mood:by('mood').value,impulse:by('imp').value,trigger:by('trigger').value,...practice(),note:by('note').value.trim()});localStorage.setItem(key,JSON.stringify(rows));e.target.reset();by('help').hidden=true;delete by('help').dataset.linked;for(const id of ['urge','action','before','after','outcome'])by(id).selectedIndex=0;by('msg').textContent='已保存到过往手记。';show()}catch{by('msg').textContent='保存失败，请先复制输入的文字。'}};window.addEventListener('storage',show);show();</script></html>
